name: Weekly Envisoft Data Sync

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      days_to_fetch:
        description: 'Số ngày lùi lại từ hôm qua (tối đa 30). Mặc định 14.'
        required: false
        default: '14'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run automation
        env:
          ENVISOFT_USERNAME: ${{ secrets.ENVISOFT_USERNAME }}
          ENVISOFT_PASSWORD: ${{ secrets.ENVISOFT_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TARGET_YEAR: '2026'
          DAYS_TO_FETCH: ${{ github.event.inputs.days_to_fetch || '14' }}
        run: python main.py

      - name: Upload downloaded files (debug)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: downloaded-reports-${{ github.run_number }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore
